<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600&f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1584px; height:396px; overflow:hidden; }
  body {
    background:#0b0a10;
    font-family:"Satoshi", sans-serif;
    color:#f2eff9;
    position:relative;
  }
  /* One lilac light source, upper right — the same "light not paint" rule as the site. */
  .glow {
    position:absolute; inset:0;
    background:
      radial-gradient(ellipse 46% 150% at 78% 14%, rgba(167,139,250,.30), transparent 62%),
      radial-gradient(ellipse 30% 110% at 96% 60%, rgba(124,92,214,.24), transparent 66%),
      radial-gradient(ellipse 60% 120% at 30% 100%, rgba(11,10,16,.9), transparent 70%);
  }
  /* The spark: white core, lilac halo — borrowed from the site's hero. */
  .spark {
    position:absolute; left:1180px; top:150px;
    width:9px; height:9px; border-radius:50%; background:#fff;
    box-shadow:0 0 14px 4px rgba(255,255,255,.85),
               0 0 44px 16px rgba(196,176,255,.5),
               0 0 120px 54px rgba(124,92,214,.26);
  }
  .rule {
    position:absolute; left:1180px; top:196px; width:250px; height:1px;
    background:linear-gradient(90deg, rgba(196,176,255,.85), transparent);
  }
  .copy { position:absolute; left:96px; top:96px; }
  .name {
    font-family:"Clash Display", sans-serif;
    font-weight:600; font-size:63px; line-height:1.04; letter-spacing:-.02em;
  }
  .name em { font-style:normal; color:#c4b0ff; }
  .role {
    margin-top:18px; font-size:23px; font-weight:500; color:#b6abd1; letter-spacing:.005em;
  }
  /* Bottom-RIGHT: LinkedIn drops the avatar over the bottom-left corner. */
  .meta {
    position:absolute; right:96px; bottom:48px;
    display:flex; gap:14px; align-items:center;
    font-size:16px; font-weight:700; letter-spacing:.15em; text-transform:uppercase;
    color:#877ca6;
  }
  .meta .dot { width:4px; height:4px; border-radius:50%; background:#7c5cd6; }
  /* LinkedIn drops the avatar over the lower-left; nothing important goes below y=300 there. */
  .safe { position:absolute; left:0; bottom:0; width:300px; height:150px; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="spark"></div>
  <div class="rule"></div>

  <div class="copy">
    <div class="name">Product Designer <em>(UI/UX)</em></div>
    <div class="role">B2B SaaS &amp; AI products · Design systems · Figma → React</div>
  </div>

  <div class="meta">
    <span>Tbilisi</span><span class="dot"></span>
    <span>Remote · UTC+4</span><span class="dot"></span>
    <span>Open to work</span>
  </div>
</body>
</html>
